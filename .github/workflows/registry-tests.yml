name: Registry tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: registry-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # CPython 3.13: the version of the recorded S01-S06 runs (docs/sprint-status.md,
      # docs/trust-limitations.md). The imported baseline source targets 3.12 and the
      # lock was compiled with --python-version 3.11 (--universal); both were builder
      # self-runs only. Tests were also run locally on 3.11/3.12 (see PR description).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install hash-locked test dependencies
        run: python -m pip install --require-hashes -r requirements-s01.lock.txt

      - name: Install hash-locked Ed25519 adapter dependency
        run: python -m pip install --require-hashes -r requirements-ed25519.lock.txt

      - name: Run existing test suite (unchanged)
        run: python -m pytest -q -ra

      # pytest exits non-zero (code 5) if nothing is collected, so this step fails
      # if test_s06_integrity.py is missing, renamed or deselected.
      - name: Confirm tests/test_s06_integrity.py executes
        run: python -m pytest -q tests/test_s06_integrity.py
